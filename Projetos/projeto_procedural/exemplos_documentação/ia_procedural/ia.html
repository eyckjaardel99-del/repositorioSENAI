<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Mapa Procedural</title>
    <!-- Vinculação do arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Gerador de Mapa Procedural</h1>

    <div class="container">
        <!-- O Canvas onde o mapa será desenhado -->
        <canvas id="mapCanvas" width="800" height="800"></canvas>

        <div class="controls">
            <button id="generateBtn">Gerar Novo Mapa</button>
            <div class="seed-display">Seed: <span id="seedVal">0</span></div>
        </div>
    </div>

    <!-- Vinculação do arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
