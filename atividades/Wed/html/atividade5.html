<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>calculadora</title>
</head>
<body>
    <h1>calculadora</h1>

    <label for="num1">num 1</label>
    <input type="number" id="num1">

    <br>

    <label for="num2">num 2</label>
    <input type="number" id="num2">
    <br><br>

        <button onclick="somar()">
            SOMAR
        </button>

        <button onclick="multiplicar()">
            multiplicar
        </button>

        <button onclick="sub()">
            subtrair
        </button>

        <button onclick="div()">
            divisão
        </button>

            <P id="resultado"></P>

    <script>
        function somar(){
            const camponum1 = document.getElementById("num1");
            const camponum2 = document.getElementById("num2");

            const num1 = Number(camponum1.value);
            const num2 = Number(camponum2.value);

            const resultado = num1 + num2;

            const campoResultado = document.getElementById("resultado");

            campoResultado.textContent = "resultado; " + resultado;
        }

        function multiplicar(){
            const camponum1 = document.getElementById("num1");
            const camponum2 = document.getElementById("num2");

            const num1 = Number(camponum1.value);
            const num2 = Number(camponum2.value);

            const resultado = num1 * num2;

             const campoResultado = document.getElementById("resultado");
            
             campoResultado.textContent = "resultado; " + resultado;
            }

        function sub(){
            const camponum1 = document.getElementById("num1");
            const camponum2 = document.getElementById("num2");

            const num1 = Number(camponum1.value);
            const num2 = Number(camponum2.value);

            const resultado = num1 - num2;

            const campoResultado = document.getElementById("resultado");
             
            campoResultado.textContent = "resultado; " + resultado;
        }

        function div(){

            const camponum1 = document.getElementById("num1");
            const camponum2 = document.getElementById("num2");

            
            const num1 = Number(camponum1.value);
            const num2 = Number(camponum2.value);

            if(num2 === 0 || num1 === 0){
                  const campoResultado = document.getElementById("resultado");
             
             campoResultado.textContent = "nao e divisivel";
                
            }else{

        
            const resultado = num1 / num2;

            const campoResultado = document.getElementById("resultado");
             
             campoResultado.textContent = "resultado; " + resultado;
            }
        }
    
    </script>

</body>
</html>
