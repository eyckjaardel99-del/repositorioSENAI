<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>login</title>
</head>
<body class="login-page">
    <main class="login-container">
        <div class="logo">📦</div>

        <h1>Bem_vindo</h1>
        <p class="subtitulo">entre para acessar seu sitema</p>

        <form id="formLogin">
            <div class="campo">
                <label for="uduario" >usuario: </label>
                <input type="text" id="usuario" required> 
            </div>

            <div class="campo">
                <label for="senha" >senha</label>
                <input type="password" id="senha" placeholder="digite senha" required>


            </div>

            <p id="mensagemErro" class="mensagem-erro"></p>

            <button type="submit" class="botao-principal">entrar sistema</button>

        </form>
        <p class="rodape">sistema de cadastro de produto</p>

    </main>

    <script src="login.js"></script>
</body>
</html>
