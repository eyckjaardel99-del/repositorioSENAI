<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="logo">🐧</div>
        <h1 class="subtitulo ">oloa</h1>
        <p class="subtitulo ">entrar no site</p>

        <form id="formLogin">
                    <div class="campo">
                        <label for="usuario">Usuário: </label>
                        <input type="text" id="usuario" placeholder="Digite seu usuário" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha: </label>
                        <input type="password" id="senha" placeholder="Digite sua Senha" required>
                    </div>

                    <p id="mensagemErro" class="mensagem-erro"></p>

                    <button type="submit" class="botao-principal">tentar</button>
        </form>

        
    </main>
    <script src="./js/script.js"></script>
</body>
</html>
